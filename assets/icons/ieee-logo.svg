<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="100%" height="100%">
  <!-- IEEE Diamond Insignia -->
  <g fill="none" stroke="#f6c453" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 30 10 L 50 30 L 30 50 L 10 30 Z" fill="#090a0f" stroke="#f6c453" stroke-width="2"/>
    <!-- Internal arrow / right-hand coil symbol -->
    <path d="M 30 16 L 30 44" stroke="#ffffff" stroke-width="2"/>
    <path d="M 23 23 L 30 16 L 37 23" stroke="#ffffff" stroke-width="2"/>
    <circle cx="30" cy="30" r="8" stroke="#f6c453" stroke-dasharray="3 3" stroke-width="1.5"/>
  </g>
  <!-- IEEE Typography -->
  <text x="65" y="38" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="3" fill="#ffffff">
    IEEE
  </text>
  <text x="65" y="49" font-family="'Space Mono', monospace" font-size="8" font-weight="600" letter-spacing="2.5" fill="#f6c453">
    ADVANCING TECHNOLOGY
  </text>
</svg>
