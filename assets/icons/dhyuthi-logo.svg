<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e69a19"/>
      <stop offset="45%" stop-color="#f6c453"/>
      <stop offset="100%" stop-color="#fff4cc"/>
    </linearGradient>
    <linearGradient id="violetFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#641ae6"/>
      <stop offset="60%" stop-color="#9d5bf0"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="flameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer ambient ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#goldFlame)" stroke-width="1.2" opacity="0.35" stroke-dasharray="4 3" />
  
  <!-- Outer glowing aura -->
  <circle cx="50" cy="52" r="32" fill="#7b3fe4" opacity="0.18" filter="url(#flameGlow)"/>

  <!-- Left Violet Wing Curve -->
  <path d="M 50 16 C 35 34, 26 56, 35 74 C 40 84, 52 86, 50 72 C 48 58, 41 47, 50 16 Z" 
        fill="url(#violetFlame)" opacity="0.85" filter="url(#flameGlow)"/>

  <!-- Main Golden Flame Core (Intertwined Helix) -->
  <path d="M 50 14 C 58 28, 73 45, 67 66 C 62 82, 45 85, 39 72 C 34 60, 48 48, 50 14 Z" 
        fill="url(#goldFlame)" filter="url(#flameGlow)"/>

  <!-- Inner Radiant Spark Flame -->
  <path d="M 50 36 C 45 48, 42 60, 48 70 C 53 77, 60 72, 57 62 C 54 52, 49 43, 50 36 Z" 
        fill="#ffffff" opacity="0.9" filter="url(#flameGlow)"/>

  <!-- Base Radiant Node -->
  <ellipse cx="50" cy="80" rx="14" ry="4" fill="url(#goldFlame)" opacity="0.6" filter="url(#flameGlow)"/>
  <circle cx="50" cy="79" r="2.5" fill="#fff"/>
</svg>
